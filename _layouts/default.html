<!doctype html>
<html lang="{{ page.lang | default: site.lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<meta name="color-scheme" content="light dark">
<style>
  :root { --ink: #111827; --muted: #6b7280; --accent: #2563eb; --rule: #e5e7eb; --bg: #ffffff; --card: #f8fafc; }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #f3f4f6; --muted: #9ca3af; --accent: #60a5fa; --rule: #1f2937; --bg: #0b0f19; --card: #111827; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.6 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "PingFang SC", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans CJK SC", "Noto Sans CJK JP", sans-serif; -webkit-font-smoothing: antialiased; }
  header { border-bottom: 1px solid var(--rule); }
  .bar { max-width: 760px; margin: 0 auto; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .brand { display: inline-flex; align-items: center; gap: 10px; color: var(--ink); text-decoration: none; font-weight: 700; letter-spacing: -0.01em; }
  .brand .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--accent); display: inline-block; }
  nav.langs a { color: var(--muted); text-decoration: none; margin-left: 14px; font-size: 15px; }
  nav.langs a[aria-current="true"] { color: var(--accent); font-weight: 600; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 2rem; line-height: 1.2; letter-spacing: -0.02em; margin: 0.6em 0 0.5em; }
  h2 { font-size: 1.35rem; margin-top: 2em; letter-spacing: -0.01em; }
  h3 { font-size: 1.1rem; margin-top: 1.6em; }
  a { color: var(--accent); }
  li { margin: 0.3em 0; }
  table { border-collapse: collapse; width: 100%; font-size: 15px; }
  th, td { border: 1px solid var(--rule); padding: 8px 10px; text-align: left; vertical-align: top; }
  th { background: var(--card); }
  hr { border: 0; border-top: 1px solid var(--rule); margin: 2.5em 0; }
  .cards { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); margin-top: 24px; }
  .card { display: block; padding: 18px; border: 1px solid var(--rule); border-radius: 14px; background: var(--card); color: var(--ink); text-decoration: none; }
  .card strong { display: block; color: var(--accent); margin-bottom: 4px; }
  .card span { color: var(--muted); font-size: 15px; }
  footer { max-width: 760px; margin: 0 auto; padding: 0 16px 48px; color: var(--muted); font-size: 14px; }
  footer a { color: var(--muted); }
</style>
</head>
<body>
<header>
  <div class="bar">
    <a class="brand" href="{{ page.home | default: '/' | relative_url }}"><span class="dot"></span>Fitch</a>
    {% if page.alternates %}
    <nav class="langs" aria-label="Language">
      {% for alt in page.alternates %}<a href="{{ alt.url | relative_url }}" lang="{{ alt.lang }}" hreflang="{{ alt.lang }}"{% if alt.lang == page.lang %} aria-current="true"{% endif %}>{{ alt.label }}</a>{% endfor %}
    </nav>
    {% endif %}
  </div>
</header>
<main>
{{ content }}
</main>
<footer>
  <p>Fitch is made by Fateh Khan. Questions: <a href="mailto:fatehkhann@gmail.com">fatehkhann@gmail.com</a></p>
</footer>
</body>
</html>
